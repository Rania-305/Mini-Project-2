<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Club Event Task &amp; Budget Delegator</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Club Event Task &amp; Budget Delegator</h1>
    <div class="reset-control">
      <button id="reset-btn" class="btn btn-danger" type="button">Reset All Data</button>
      <div id="reset-confirm" class="reset-confirm" hidden>
        <span>Delete all events, tasks, and budget data?</span>
        <button id="reset-confirm-btn" class="btn btn-danger" type="button">Yes, reset</button>
        <button id="reset-cancel-btn" class="btn btn-secondary" type="button">Cancel</button>
      </div>
    </div>
  </header>

  <main>
    <section id="completed-summary" class="completed-summary" aria-label="Completed events">
      <span class="completed-summary-label">Events Completed</span>
      <span id="completed-summary-value" class="completed-summary-value">0 / 0</span>
    </section>

    <section class="add-event-section">
      <h2>Add Event</h2>
      <form id="add-event-form" class="inline-form" novalidate>
        <div class="field">
          <label for="event-name">Event name</label>
          <input id="event-name" name="event-name" type="text" placeholder="e.g. Spring Gala" required />
        </div>
        <div class="field">
          <label for="event-status">Status</label>
          <select id="event-status" name="event-status">
            <option value="Planning">Planning</option>
            <option value="Active">Active</option>
            <option value="Incomplete">Incomplete</option>
            <option value="Done">Done</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">Add Event</button>
      </form>
      <p id="add-event-error" class="error-message" role="alert" hidden></p>
    </section>

    <section class="event-list-section">
      <h2>Events</h2>
      <div id="event-list" class="event-list"></div>
      <p id="empty-state" class="empty-state" hidden>No events yet — add one above.</p>
    </section>

    <section id="totals-bar" class="totals-bar" aria-label="Semester totals">
      <div class="totals-item">
        <span class="totals-label">SGA Spent</span>
        <span id="totals-sga" class="totals-value">$0</span>
      </div>
      <div class="totals-item">
        <span class="totals-label">OBI Spent</span>
        <span id="totals-obi" class="totals-value">$0</span>
      </div>
      <div class="totals-item totals-combined">
        <span class="totals-label">Combined Total</span>
        <span id="totals-combined" class="totals-value">$0</span>
      </div>
    </section>
  </main>

  <template id="event-card-template">
    <article class="event-card" data-event-id="">
      <div class="event-card-header">
        <div class="event-card-title">
          <h3 class="event-name"></h3>
          <select class="event-status-select">
            <option value="Planning">Planning</option>
            <option value="Active">Active</option>
            <option value="Incomplete">Incomplete</option>
            <option value="Done">Done</option>
          </select>
        </div>
        <button type="button" class="btn btn-secondary toggle-btn">Expand</button>
      </div>

      <div class="progress-row">
        <div class="progress-bar">
          <div class="progress-bar-fill"></div>
        </div>
        <span class="progress-fraction"></span>
        <span class="tasks-done-badge" hidden>All tasks done</span>
      </div>

      <div class="spend-row">
        <span class="spend-item">SGA: <span class="spend-sga"></span></span>
        <span class="spend-item">OBI: <span class="spend-obi"></span></span>
        <span class="spend-item spend-total">Total: <span class="spend-event-total"></span></span>
      </div>

      <div class="event-detail" hidden>
        <div class="task-section">
          <h4>Tasks</h4>
          <ul class="task-list"></ul>

          <form class="add-task-form inline-form" novalidate>
            <div class="field">
              <label>Task name</label>
              <input type="text" class="task-name-input" placeholder="Task name" required />
            </div>
            <div class="field">
              <label>Owner</label>
              <input type="text" class="task-owner-input" placeholder="Owner" />
            </div>
            <div class="field">
              <label>Deadline</label>
              <input type="date" class="task-deadline-input" />
            </div>
            <button type="submit" class="btn btn-primary">Add Task</button>
          </form>
          <p class="task-error error-message" role="alert" hidden></p>
        </div>

        <div class="budget-section">
          <h4>Log Budget</h4>
          <ul class="budget-list"></ul>
          <form class="add-budget-form inline-form" novalidate>
            <div class="field">
              <label>Amount ($)</label>
              <input type="number" class="budget-amount-input" min="0" step="0.01" placeholder="0.00" required />
            </div>
            <div class="field">
              <label>Category</label>
              <select class="budget-category-input">
                <option value="Food">Food</option>
                <option value="Crafts">Crafts</option>
                <option value="Supplies">Supplies</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="field budget-other-field" hidden>
              <label>Specify</label>
              <input type="text" class="budget-other-input" placeholder="e.g. Decorations" />
            </div>
            <div class="field">
              <label>Source</label>
              <select class="budget-source-input">
                <option value="SGA">SGA</option>
                <option value="OBI">OBI</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary">Log Budget</button>
          </form>
          <p class="budget-error error-message" role="alert" hidden></p>
        </div>

        <div class="details-section">
          <h4>Additional Details</h4>
          <div class="field">
            <label>Notes</label>
            <textarea class="details-notes-input" rows="3" placeholder="Notes, descriptions, logistics..."></textarea>
          </div>

          <ul class="details-link-list"></ul>
          <form class="add-link-form inline-form" novalidate>
            <div class="field">
              <label>Label</label>
              <input type="text" class="details-link-label-input" placeholder="e.g. Instagram post" required />
            </div>
            <div class="field">
              <label>Link</label>
              <input type="url" class="details-link-url-input" placeholder="https://..." required />
            </div>
            <button type="submit" class="btn btn-primary">Add Link</button>
          </form>
          <p class="details-link-error error-message" role="alert" hidden></p>
        </div>
      </div>
    </article>
  </template>

  <template id="task-row-template">
    <li class="task-row" data-task-id="">
      <input type="checkbox" class="task-done-checkbox" />
      <div class="task-info">
        <span class="task-name"></span>
        <span class="task-meta"></span>
      </div>
      <button type="button" class="btn btn-icon delete-task-btn" aria-label="Delete task">&times;</button>
    </li>
  </template>

  <template id="budget-row-template">
    <li class="budget-row" data-budget-id="">
      <div class="budget-info">
        <span class="budget-amount"></span>
        <span class="budget-meta"></span>
      </div>
      <button type="button" class="btn btn-icon delete-budget-btn" aria-label="Delete budget entry">&times;</button>
    </li>
  </template>

  <template id="link-row-template">
    <li class="link-row" data-link-id="">
      <div class="link-info">
        <a class="link-anchor" target="_blank" rel="noopener noreferrer"></a>
        <span class="link-label"></span>
      </div>
      <button type="button" class="btn btn-icon delete-link-btn" aria-label="Delete link">&times;</button>
    </li>
  </template>

  <script src="js/storage.js"></script>
  <script src="js/calculations.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
